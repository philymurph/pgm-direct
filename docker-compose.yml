services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pgmsupply
    ports:
      - "5432:5432"
    volumes:
      - pgm_supply_db_data:/var/lib/postgresql/data

volumes:
  pgm_supply_db_data:
